kind = "api"
previewPath = "/api"
title = "Cosmetics E-Commerce Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd spring-app && mvn spring-boot:run"

[services.production]

[services.production.build]
args = ["bash", "-lc", "cd spring-app && mvn -q -DskipTests package"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["java", "-jar", "spring-app/target/cosmetics-ecommerce-backend-0.0.1-SNAPSHOT.jar"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
